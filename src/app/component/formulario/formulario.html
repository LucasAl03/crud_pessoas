<div id="div-form">
    <form id="form-pessoa">
        <label for="nome">Nome*</label>
        <input type="text" name="nome" id="nome" class="elem-form-01" required  maxlength="60" [(ngModel)]="nome" placeholder="Seu nome">

        <label for="email">Email*</label>
        <input type="text" name="email" id="email" class="elem-form-01" required  maxlength="60" [(ngModel)]="email" placeholder="Seu email">

        <label for="cpf">CPF*</label>
        <input type="text" name="cpf" id="cpf" class="elem-form-02" required  maxlength="11" [(ngModel)]="cpf" placeholder="Seu cpf">

        <label for="dataNascimento">Data Nascimento*</label>
        <input type="date" name="dataNascimento" id="dataNascimento" class="elem-form-02" [(ngModel)]="dataNascimento" required>

        <label for="uf">UF*</label>
        <select name="uf" [(ngModel)]="uf" (change)="carregarMunicipios()" class="elem-form-02">

            <option selected>SELECIONE A UF</option>

            @for (item of ufs; track item.id) {
                <option [ngValue]="item">
                    {{ item.sigla }} - {{ item.nome }}
                </option>
            }
        </select>

        <label for="cidade">Cidade*</label>
        <select id="municipio" name="municipio" [(ngModel)]="municipio" [disabled]="municipios.length === 0" class="elem-form-02">
            <option value="">SELECIONE O MUNICÍPIO</option>

            @for (item of municipios; track item.id) {
                <option [value]="item.nome">
                    {{ item.nome }}
                </option>
            }
        </select>

        <div id="div-btns">
            <button type="button" id="btnSalvar" (click)="save()">{{edit ? 'Alterar' : 'Salvar'}}</button>
            <button type="reset" id="btnLimpar" (click)="limparAtributos()">Limpar</button>
        </div>
    </form>
</div>
